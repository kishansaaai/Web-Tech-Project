<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>

    <style>
      :root {
        --bg: #ffffff;
        --text: #111111;
        --muted: #666666;
        --border: #e5e7eb;
        --card: #ffffff;

        --accent: #3b82f6;
        --bg-soft: #f8fafc;
        --card-bg: #ffffff;
        --radius: 10px;

        color-scheme: light dark;
      }

      [data-theme="dark"] {
        --bg: #0b0f14;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --border: #1f2937;
        --card: #111827;

        --bg-soft: #0b0f14;
        --card-bg: #111827;
        --accent: #60a5fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg-soft);
        color: var(--text);
      }

      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 1rem;
      }

      /* ---------- HEADER ---------- */
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border);
      }

      header nav a {
        color: inherit;
        padding: 6px 10px;
        border-radius: 8px;
        text-decoration: none;
      }

      header nav a:hover {
        background: var(--border);
      }

      /* ---------- CARDS WITH SPACING ADDED ---------- */
      .card {
        border: 1px solid var(--border);
        background: var(--card-bg);
        border-radius: var(--radius);
        padding: 1rem;
        margin: 1rem 0;  /* ⭐ ADDED GAP BETWEEN CARDS */
        transition: transform 150ms ease, box-shadow 150ms ease;
      }

      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 18px rgba(0,0,0,0.06);
      }

      /* ---------- LAYOUT ---------- */
      .row {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: center;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 1rem;
      }

      /* ---------- INPUTS & BUTTONS ---------- */
      input,
      button {
        padding: 0.6rem 0.8rem;
        font-size: 1rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        color: var(--text);
      }

      input:focus {
        border-color: var(--accent);
        outline: none;
        box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
      }

      button {
        background: var(--accent);
        color: white;
        border: none;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #2563eb;
      }

      button:disabled {
        background: #9ca3af;
        cursor: not-allowed;
      }

      /* ---------- AUTOSUGGEST ---------- */
      ul[role="listbox"] {
        list-style: none;
        margin: 6px 0 0;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card-bg);
        max-height: 220px;
        overflow-y: auto;
      }

      ul[role="listbox"] li {
        padding: 0.55rem 0.75rem;
        cursor: pointer;
      }

      ul[role="listbox"] li:hover,
      ul[role="listbox"] li[aria-selected="true"] {
        background: var(--border);
      }

      .muted {
        color: var(--muted);
      }

      .error {
        color: #ef4444;
      }

      /* ---------- RESPONSIVE ---------- */
      @media (max-width: 640px) {
        .row {
          flex-direction: column;
          align-items: stretch;
        }
        input {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
